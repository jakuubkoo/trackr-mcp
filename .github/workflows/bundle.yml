# The plugin runs the committed bundle: fail when dist/index.js doesn't match index.js.
name: bundle

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code dist/index.js
